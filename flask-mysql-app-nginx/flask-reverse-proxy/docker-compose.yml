version: '3.8'

services:
  flask:
    build: ./app
    container_name: flask_app
    expose:
      - "5000"
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
