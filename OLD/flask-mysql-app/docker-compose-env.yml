version: "3.9"

services:
  web:
    build: .
    container_name: flask-app
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - .env  # ✅ Use environment variables from the .env file

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:

# ✅ Now secrets are cleanly separated into .env (which you can add to .gitignore).
#✅ Bonus Tip: Ignore .env in Git
